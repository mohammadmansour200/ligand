name: Bug report
description: Report a bug or unexpected behavior in the application
labels:
  - ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide as much detail as possible so we can reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the problem.
      placeholder: e.g. The app crashes when rotating a molecule in 3D view on Android.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps to reproduce the issue.
      placeholder: |
        1. Open the app.
        2. Navigate to...
        3. Perform...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: The molecule should rotate smoothly without freezing or closing the app.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: The app freezes and closes shortly after the rotation gesture begins.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      description: Select the platform affected.
      multiple: false
      options:
        - Android
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: "Example: Android 14, Ubuntu 24.04, Windows 11"
      placeholder: e.g. Android 14
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. v1.1.0

  - type: input
    id: device
    attributes:
      label: Device model / hardware
      description: Useful for Android or hardware-specific bugs.
      placeholder: e.g. Samsung Galaxy S24

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Attach screenshots or a screen recording if applicable.
      placeholder: Drag and drop screenshots or describe where the issue appears.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: Logs, reproduction notes, environment details, etc.
